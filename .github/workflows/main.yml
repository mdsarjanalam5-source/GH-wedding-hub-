
name: Build G.H Wedding Hub APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Extract and Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project ZIP
        shell: bash
        run: |
          set -e
          ZIP_FILE="GH_Wedding_Hub_Android_Studio_Project.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Android project ZIP not found!"
            ls -la
            exit 1
          fi

          mkdir -p extracted_project
          unzip -oq "$ZIP_FILE" -d extracted_project

          GRADLEW="$(find extracted_project -type f -name gradlew -print -quit)"

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found inside ZIP."
            echo "The ZIP may not contain a complete Android project."
            find extracted_project -maxdepth 4 -type f | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        working-directory: ${{ env.PROJECT_DIR }}
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GH-Wedding-Hub-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
          
